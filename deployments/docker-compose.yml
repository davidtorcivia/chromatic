services:
  chromatic:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: deployments-chromatic
    container_name: chromatic
    restart: unless-stopped
    # Host networking is required by the WebRTC SFU: it filters out docker/veth
    # interfaces (internal/webrtc/sfu.go) and advertises real-interface ICE
    # candidates directly. On this host Chromatic sits behind the shared Caddy
    # reverse proxy (/nvme-mirror/apps/caddy) which routes
    # stream.davidtorcivia.com -> 192.168.1.131:${CHROMATIC_PORT}. The bundled
    # caddy/bridge-network setup in upstream's compose is intentionally NOT used
    # here because it would collide with that shared proxy on ports 80/443.
    network_mode: host
    environment:
      - DATABASE_PATH=/data/chromatic.db
      - UPLOAD_PATH=/data/files
      - LOGO_PATH=/data/logos
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - PUBLIC_URL=${PUBLIC_URL}
      - TURN_MODE=${TURN_MODE:-external}
      - TURN_SECRET=${TURN_SECRET}
      - TURN_REALM=${TURN_REALM}
      - TURN_EXTERNAL_URLS=${TURN_EXTERNAL_URLS}
      - TURN_EXTERNAL_URL=${TURN_EXTERNAL_URL}
      - TURN_EXTERNAL_USER=${TURN_EXTERNAL_USER}
      - TURN_EXTERNAL_PASS=${TURN_EXTERNAL_PASS}
      - TURN_CLOUDFLARE_KEY_ID=${TURN_CLOUDFLARE_KEY_ID}
      - TURN_CLOUDFLARE_API_TOKEN=${TURN_CLOUDFLARE_API_TOKEN}
      - TURN_CLOUDFLARE_CREDENTIAL_TTL=${TURN_CLOUDFLARE_CREDENTIAL_TTL:-3600}
      - TURN_CLOUDFLARE_CREDENTIAL_SKEW=${TURN_CLOUDFLARE_CREDENTIAL_SKEW:-60}
      - PORT=${CHROMATIC_PORT:-3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PRODUCTION_MODE=${PRODUCTION_MODE:-true}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8}
    volumes:
      - chromatic_data:/data

volumes:
  chromatic_data:
