# Coturn TURN Server Configuration
# For Chromatic WebRTC NAT traversal

listening-port=3478
tls-listening-port=5349

# Enable fingerprint for TURN messages
fingerprint

# Use long-term credential mechanism
lt-cred-mech

# Use auth secret for time-limited credentials
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${TURN_REALM}

# CRITICAL: Set your server's public IP
# Replace with actual public IP in production
external-ip=${PUBLIC_IP}

# Resource limits
total-quota=100
bps-capacity=0
stale-nonce

# Disable multicast
no-multicast-peers

# Block private IP ranges to prevent SSRF
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Logging
log-file=/var/log/coturn.log
simple-log

# Performance tuning
proc-quota-limit=10
user-quota=12
